# Publishes the site to GitHub Pages. The deployed tree is exactly
# `nix build .#site` — the same one `nix run .#serve` tests locally —
# so this job builds and uploads, and decides nothing.
#
# The engine and the snapshot are not built here: they need docker and
# emscripten, and a native build of the same QEMU fork (docs/engine.md).
# They are built by hand, published to the `engine` release, and pinned
# by hash in nix/engine-pins.json, so the derivation fetches them
# rather than the workflow.
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - nix/**
      - tools/**
      - flake.lock
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys must land in order; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v15
        with:
          name: trynix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}

      - name: Build the site
        # Everything served is in this one derivation — site, vendored
        # dependencies, engine, snapshot, guest image, sibling-output
        # shards and the asset manifest. The store output is read-only
        # and symlinked; the pages artifact needs a plain writable
        # directory, so dereference-copy it out.
        run: |
          nix build .#site -L
          cp -rL result _site
          chmod -R u+w _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
