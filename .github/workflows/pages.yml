# Publishes the site to GitHub Pages: `nix build .#site` (the same tree
# `nix run .#serve` tests locally), with the two out-of-band artifact
# sets overlaid — the guest image from `nix build .#guest` under guest/,
# and the qemu engine from the engine release under qemu/.
#
# The engine is not in the tree and is not built here: it needs docker
# and emscripten (docs/engine.md), takes tens of minutes, and changes
# only when the qemu-wasm pin moves. It is built by hand and uploaded to
# the `engine` release tag; this job downloads it.
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - nix/**
      - flake.lock
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys must land in order; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v15
        with:
          name: trynix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}

      - name: Build the site
        # The store output is read-only and symlinked; the pages artifact
        # needs a plain writable directory, so dereference-copy it out.
        run: |
          nix build .#site
          cp -rL result _site
          chmod -R u+w _site

      - name: Overlay the guest image
        run: |
          nix build .#guest -L
          mkdir -p _site/guest
          cp -rL result/. _site/guest/
          chmod -R u+w _site/guest

      - name: Overlay the qemu engine
        env:
          GH_TOKEN: ${{ github.token }}
        # A missing release is not a failed deploy: the site still
        # walks closures and explains itself, and only the Boot button
        # is dead. docs/engine.md covers publishing the release.
        run: |
          mkdir -p _site/qemu
          if ! gh release download engine --repo "$GITHUB_REPOSITORY" --dir _site/qemu --clobber; then
            echo "::warning::no engine release; the deployed site cannot boot a VM"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
