# Formatting first, then `nix flake check`, which runs everything the
# flake defines — all of it offline:
#
#   checks.tests — the node test suite (the narinfo parser, and the NAR
#                  parser against bytes nix itself wrote)
#   checks.site  — the deployable tree assembles: entry page and the
#                  hashed module directory in place
#
# Then the two things those cannot see. The site is opened in a real
# browser and has to reach a shell: every check above passed while the
# guest hung on resume and readers waited out a three minute timeout,
# because being the right bytes and booting are different questions.
# And then a probe runs inside the guest and has to agree with the
# hardware, because booting and computing correctly are different
# questions again -- the emulator's POPCNT was wrong for a year and
# nothing here noticed.
#
# The guest image is built here too, and pushed to cachix: it is the one
# expensive derivation in the tree (a Linux kernel), and the pages job
# and every contributor substitute it rather than compiling it.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v15
        with:
          name: trynix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # A pull request from a fork has no token; read from the cache
          # and skip pushing rather than failing the job.
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}

      - name: Formatting
        run: nix fmt -- --ci

      - name: Tests
        run: nix flake check -L

      - name: Guest image
        run: nix build .#guest -L

      # Cold boots in headless chromium: the resume handshake has raced
      # twice, and a race only shows up over repeated fresh starts. This
      # needs the network, since the closure comes from cache.nixos.org.
      - name: Boots to a shell
        run: nix run .#boot-test -- --site "$(nix build .#site --no-link --print-out-paths)" --runs 5

      # And the thing booting cannot see: that the emulator computes what
      # the hardware would. Its JIT answered POPCNT with a stale register
      # for as long as the guest ran a CPU model too old to emit the
      # instruction, and every check above passed the whole time. This
      # one runs a probe in the guest and reads its verdict. No network:
      # the probe is one static path out of the site's own cache.
      - name: Computes what the hardware would
        run: nix run .#cpu-test -- --site "$(nix build .#site --no-link --print-out-paths)"
