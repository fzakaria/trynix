# Formatting first, then `nix flake check`, which runs everything the
# flake defines — all of it offline:
#
#   checks.tests — the node test suite (the narinfo parser, and the NAR
#                  parser against bytes nix itself wrote)
#   checks.site  — the deployable tree assembles: entry page and the
#                  hashed module directory in place
#
# The guest image is built here too, and pushed to cachix: it is the one
# expensive derivation in the tree (a Linux kernel), and the pages job
# and every contributor substitute it rather than compiling it.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v15
        with:
          name: trynix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # A pull request from a fork has no token; read from the cache
          # and skip pushing rather than failing the job.
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}

      - name: Formatting
        run: nix fmt -- --ci

      - name: Tests
        run: nix flake check -L

      - name: Guest image
        run: nix build .#guest -L
