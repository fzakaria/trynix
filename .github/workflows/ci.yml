# Formatting first, then `nix flake check`, which runs everything the
# flake defines — all of it offline:
#
#   checks.tests — the node test suite (the narinfo parser, and the NAR
#                  parser against bytes nix itself wrote)
#   checks.site  — the deployable tree assembles: entry page and the
#                  hashed module directory in place
#
# Then the two things those cannot see. The site is opened in a real
# browser and has to reach a shell: every check above passed while the
# guest hung on resume and readers waited out a three minute timeout,
# because being the right bytes and booting are different questions.
# And then a probe runs inside the guest and has to agree with the
# hardware, because booting and computing correctly are different
# questions again -- the emulator's POPCNT was wrong for a year and
# nothing here noticed.
#
# The guest image is built here too, and pushed to cachix: it is the one
# expensive derivation in the tree (a Linux kernel), and the pages job
# and every contributor substitute it rather than compiling it.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v15
        with:
          name: trynix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # A pull request from a fork has no token; read from the cache
          # and skip pushing rather than failing the job.
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}

      - name: Formatting
        run: nix fmt -- --ci

      - name: Tests
        run: nix flake check -L

      - name: Guest image
        run: nix build .#guest -L

      # Cold boots in headless chromium: the resume handshake has raced
      # twice, and a race only shows up over repeated fresh starts. This
      # needs the network, since the closure comes from cache.nixos.org.
      - name: Boots to a shell
        run: nix run .#boot-test -- --site "$(nix build .#site --no-link --print-out-paths)" --runs 5

      # The run above takes the engine the page picks, which is unkernel.
      # The qemu engine is the one with the resume handshake and the
      # snapshot, and it still serves x86_64 store paths and browsers
      # without JSPI, so it gets the same repeated cold starts.
      - name: Boots to a shell on the qemu engine
        run: nix run .#boot-test -- --site "$(nix build .#site --no-link --print-out-paths)" --engine qemu --runs 5

      # The bzip2 decoder is the one the page does not load: it is
      # imported the first time a boot meets a path the cache still
      # stores that way, and hello at its newest is xz like everything
      # else recent, so the run above never reaches that import. hello
      # 2.7 is bzip2, three paths and a 201 KB archive, so one run buys
      # the module resolving out of the hashed js directory and its wasm
      # fetching under COOP/COEP, neither of which node can stand in for.
      # hello 2.7 predates Hydra's aarch64 builds, so only the qemu
      # engine has a build of it to boot.
      - name: Boots a package the cache still keeps in bzip2
        run: nix run .#boot-test -- --site "$(nix build .#site --no-link --print-out-paths)" --package 'hello@2.7' --engine qemu --runs 1

      # GUI programs cross more of the page than anything boot-test
      # reaches: the relay the page starts in the guest, wland's
      # compositor on the page, kwshm for foot's pixels, for es2gears
      # the site's GL driver, the guest's virtio-gpu device and the
      # page's GL renderer, and for xterm the X server the page adds. A
      # shell appears with every one of those broken. The runner has no
      # GPU, so Chromium draws WebGL with SwiftShader (--gpu software).
      # Needs the network, as above.
      - name: Shows GUI programs' windows
        run: nix run .#gui-test -- --site "$(nix build .#site --no-link --print-out-paths)" --gpu software

      # Missing names must become visible when a package joins a running VM.
      - name: Adds packages after boot through WebMCP
        run: nix run .#webmcp-test -- --site "$(nix build .#site --no-link --print-out-paths)"

      # And the thing booting cannot see: that the emulator computes what
      # the hardware would. Its JIT answered POPCNT with a stale register
      # for as long as the guest ran a CPU model too old to emit the
      # instruction, and every check above passed the whole time. This
      # one runs a probe in the guest and reads its verdict. No network:
      # the probe is one static path out of the site's own cache.
      - name: Computes what the hardware would
        run: nix run .#cpu-test -- --site "$(nix build .#site --no-link --print-out-paths)"

      # The throughput probe, as a smoke run: it has to finish and print
      # every row. The numbers go in the log for eyes; a shared runner is
      # too noisy to hold them to a threshold.
      - name: Runs every instruction class
        run: nix run .#emubench -- --site "$(nix build .#site --no-link --print-out-paths)"
